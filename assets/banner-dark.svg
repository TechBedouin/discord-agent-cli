<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="discord-agent-cli — Persistent Discord API v10 Gateway Daemon and Loopback CLI">
  <defs>
    <pattern id="grid-dark" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#141A26" stroke-width="1" />
    </pattern>
    <clipPath id="card-clip-dark">
      <rect x="0" y="0" width="1200" height="320" rx="14" />
    </clipPath>
  </defs>

  <g clip-path="url(#card-clip-dark)">
    <!-- Canvas -->
    <rect width="1200" height="320" fill="#0B0E14" />
    <rect width="1200" height="320" fill="url(#grid-dark)" />

    <!-- Subtle Corner Registration Ticks -->
    <path d="M 24 38 L 24 24 L 38 24" fill="none" stroke="#283247" stroke-width="1.5" />
    <path d="M 1162 24 L 1176 24 L 1176 38" fill="none" stroke="#283247" stroke-width="1.5" />
    <path d="M 24 282 L 24 296 L 38 296" fill="none" stroke="#283247" stroke-width="1.5" />
    <path d="M 1162 296 L 1176 296 L 1176 282" fill="none" stroke="#283247" stroke-width="1.5" />

    <!-- Left Column: Eyebrow Spec Pill -->
    <rect x="56" y="42" width="344" height="28" rx="6" fill="#111622" stroke="#232C3E" stroke-width="1" />
    <circle cx="74" cy="56" r="4" fill="#22C55E" />
    <text x="88" y="60" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="0.06em">NODE &gt;=22 · API v10 · ESM TYPESCRIPT</text>

    <!-- Hero Title -->
    <text x="56" y="128" fill="#F8FAFC" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="700" letter-spacing="-1.2">discord-agent-cli</text>
    <rect x="56" y="144" width="56" height="3" rx="1.5" fill="#5865F2" />

    <!-- Subtitle -->
    <text x="56" y="182" fill="#CBD5E1" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16.5" font-weight="400">Persistent Discord Gateway daemon, bucket rate-limiter,</text>
    <text x="56" y="206" fill="#CBD5E1" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16.5" font-weight="400">and zero-overhead loopback JSON CLI for AI agents.</text>

    <!-- Terminal Command Strip -->
    <rect x="56" y="236" width="600" height="42" rx="8" fill="#0F141E" stroke="#242E42" stroke-width="1" />
    <text x="74" y="262" fill="#5865F2" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13.5" font-weight="700">$</text>
    <text x="92" y="262" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">discord-agent-cli watch &lt;channel_id&gt; --json</text>
    <text x="640" y="261" text-anchor="end" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11">127.0.0.1 IPC</text>

    <!-- Right Column: Architectural Schematic Card -->
    <rect x="704" y="42" width="440" height="236" rx="10" fill="#0F141F" stroke="#1E2638" stroke-width="1" />
    <line x1="704" y1="74" x2="1144" y2="74" stroke="#1E2638" stroke-width="1" />
    <text x="722" y="62" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="600" letter-spacing="0.08em">DAEMON ARCHITECTURE</text>
    <text x="1126" y="62" text-anchor="end" fill="#22C55E" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="600">0-HANDSHAKE-CHURN</text>

    <!-- Node 1: CLI Client -->
    <rect x="760" y="88" width="328" height="40" rx="6" fill="#151C2B" stroke="#283349" stroke-width="1" />
    <text x="776" y="112" fill="#F1F5F9" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600">CLI Client</text>
    <text x="1072" y="112" text-anchor="end" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11">--json  |  watch JSONL</text>

    <!-- Connector 1 -->
    <line x1="924" y1="128" x2="924" y2="152" stroke="#475569" stroke-width="1.5" />
    <path d="M 920 147 L 924 153 L 928 147" fill="none" stroke="#475569" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="936" y="144" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10">HTTP/1.1 + NDJSON</text>

    <!-- Node 2: Persistent Daemon -->
    <rect x="736" y="154" width="376" height="48" rx="6" fill="#141B2D" stroke="#5865F2" stroke-width="1.5" />
    <text x="754" y="174" fill="#F8FAFC" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600">Background Daemon</text>
    <text x="1094" y="174" text-anchor="end" fill="#818CF8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="600">STATEFUL PROCESS</text>
    <text x="754" y="192" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11">StateCache  ·  Bucket FIFO  ·  429 Gate</text>

    <!-- Connector 2 Fork -->
    <line x1="924" y1="202" x2="924" y2="212" stroke="#475569" stroke-width="1.5" />
    <line x1="826" y1="212" x2="1022" y2="212" stroke="#475569" stroke-width="1.5" />
    <line x1="826" y1="212" x2="826" y2="222" stroke="#475569" stroke-width="1.5" />
    <line x1="1022" y1="212" x2="1022" y2="222" stroke="#475569" stroke-width="1.5" />
    <path d="M 822 217 L 826 223 L 830 217" fill="none" stroke="#475569" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 1018 217 L 1022 223 L 1026 217" fill="none" stroke="#475569" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Node 3A & 3B -->
    <rect x="736" y="224" width="180" height="40" rx="6" fill="#151C2B" stroke="#283349" stroke-width="1" />
    <text x="750" y="241" fill="#F1F5F9" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600">Gateway WS v10</text>
    <text x="750" y="256" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10">zlib-stream · Op 6</text>

    <rect x="932" y="224" width="180" height="40" rx="6" fill="#151C2B" stroke="#283349" stroke-width="1" />
    <text x="946" y="241" fill="#F1F5F9" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600">REST API v10</text>
    <text x="946" y="256" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10">X-RateLimit · Bot/User</text>

    <!-- Outer Frame Stroke -->
    <rect x="0.5" y="0.5" width="1199" height="319" rx="14" fill="none" stroke="#1E2533" stroke-width="1" />
  </g>
</svg>
